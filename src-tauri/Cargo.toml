[package]
name = "byetype"
version = "1.23.0"
description = "ByeType - Markdown driven voice input"
authors = ["devonmochi"]
edition = "2021"
license = "MIT"
repository = "https://github.com/cwd0204/byetype"
homepage = "https://github.com/cwd0204/byetype"

[lib]
name = "byetype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-single-instance = "2.4.0"
cpal = "0.15"
base64 = "0.22"
flacenc = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "pcm", "wav"] }
tauri-plugin-global-shortcut = "2"
arboard = "3"
enigo = "0.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1", features = ["time", "macros", "process", "net", "sync"] }
tokio-util = "0.7"
s3 = { version = "0.1", default-features = false, features = ["async", "rustls"] }
zip = "2.0"
chrono = "0.4"
# AWS：Bedrock（Claude 文本/视觉）与 Amazon Transcribe（流式语音转写），走 SDK 默认凭证链（profile / ADA credential_process / SSO）
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.143"
aws-sdk-transcribestreaming = "1.116"
aws-smithy-types = "1"
futures-util = "0.3"
# 读系统 locale，供 general.language = "system" 时决定中 / 英文案
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc = "0.2"
# 会议记录的系统音频采集：Core Audio 进程 tap（聚合设备 + IOProc 走 coreaudio-sys，
# 14.2+ 的 AudioHardwareCreateProcessTap 用 dlsym 弱解析，CATapDescription 走 objc）
coreaudio-sys = "0.2"
core-foundation = "0.10"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9"
